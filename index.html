<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#06102c">
  <title>Rush Café – Stående reklameskjerm</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; width: 100%; height: 100%;
      overflow: hidden; background: #06102c;
    }
    body { font-family: Arial, Helvetica, sans-serif; }
    .screen {
      position: fixed; inset: 0;
      width: 100vw; height: 100vh; height: 100dvh;
      display: grid; place-items: center;
      background: #06102c;
    }
    .slide {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      opacity: 0; transition: opacity 450ms ease;
    }
    .slide.active { opacity: 1; }
  </style>
</head>
<body>
  <main class="screen" aria-label="Rush Café reklamevisning">
    <img class="slide active" src="assets/slush.jpg" alt="Slush – 39, 49 og 79 kroner">
    <img class="slide" src="assets/smoothie.jpg" alt="Fersk smoothie – 49 kroner">
  </main>
  <script>
    const slides = [...document.querySelectorAll(".slide")];
    let current = 0;
    setInterval(() => {
      slides[current].classList.remove("active");
      current = (current + 1) % slides.length;
      slides[current].classList.add("active");
    }, 5000);
  </script>
</body>
</html>
